<!doctype html>
<!-- translate="no": Chrome-автопереклад мутує DOM (<font>-обгортки) і ронив
     React на removeChild. Сторінка вже українською, перекладати нічого. -->
<html lang="uk" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <!-- Прототип живе за неоприлюдненим посиланням. Індексації не хочемо:
         сторінка виглядає як робочий сервіс Будпрокату, а нею не є. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Будпрокат — моя оренда (прототип)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap&subset=latin,cyrillic,cyrillic-ext"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
