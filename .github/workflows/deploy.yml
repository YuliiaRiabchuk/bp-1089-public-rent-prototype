name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Черга з одного: паралельні деплої переписують один одного.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        # Project page живе в /<repo>/ — від цього залежать і шляхи ассетів,
        # і scope service worker'а MSW, який у прототипі є бекендом.
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      # Pages не вміє SPA-rewrite: будь-який шлях глибше кореня віддає 404.
      # Копія index.html під іменем 404.html робить фолбек — /o/holiday
      # відкривається прямим посиланням.
      - run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
